[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alioune"
version = "0.3.0"
description = "Générateur de projets et de code pour FastAPI : l'équivalent d'Angular CLI ou d'Artisan (Laravel), en français."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alioune" }]
keywords = ["fastapi", "cli", "generateur", "scaffolding", "sqlalchemy", "alembic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Aliounecode/alioune-cli"
Repository = "https://github.com/Aliounecode/alioune-cli"
Issues = "https://github.com/Aliounecode/alioune-cli/issues"
Changelog = "https://github.com/Aliounecode/alioune-cli/blob/main/CHANGELOG.md"

[project.scripts]
alioune = "alioune.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alioune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
