[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alioune"
version = "0.1.0"
description = "Générateur de projets et de code pour FastAPI : l'équivalent d'Angular CLI ou d'Artisan (Laravel), en français."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alioune" }]
keywords = ["fastapi", "cli", "generateur", "scaffolding", "sqlalchemy", "alembic"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alioune = "alioune.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alioune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
