  <text x="480" y="36" text-anchor="middle" style="font-size:14px" fill="#94a3b8">alioune — terminal</text>
  <g transform="translate(10,0)">
  <text class="l0 s0" x="28" y="84" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#e2e8f0">pipx install alioune</tspan></text><text class="l1 s0" x="28" y="111" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#e2e8f0">alioune new ma-boutique</tspan></text><text class="l2 s0" x="28" y="138" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">ma-boutique/app/main.py</tspan></text><text class="l3 s0" x="28" y="165" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">ma-boutique/app/config.py</tspan></text><text class="l4 s0" x="28" y="192" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">ma-boutique/app/routeurs/accueil.py</tspan></text><text class="l5 s0" x="28" y="219" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">ma-boutique/alembic/env.py</tspan></text><text class="l6 s0" x="28" y="246" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">ma-boutique/tests/test_sante.py</tspan></text><text class="l7 s0" x="28" y="273" xml:space="preserve"><tspan fill="#94a3b8">  … 28 fichiers, environnement virtuel et dépendances installés</tspan></text><text class="l8 s0" x="28" y="300" xml:space="preserve"><tspan fill="#4ade80">Projet « ma-boutique » créé.</tspan></text><text class="l9 s0" x="28" y="327" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#e2e8f0">cd ma-boutique</tspan></text><text class="l10 s1" x="28" y="84" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#e2e8f0">alioune g ressource produit -c &quot;nom:str,prix:decimal,categorie:fk&quot;</tspan></text><text class="l11 s1" x="28" y="111" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">app/modeles/produit.py</tspan></text><text class="l12 s1" x="28" y="138" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">app/schemas/produit.py</tspan></text><text class="l13 s1" x="28" y="165" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">app/services/produit.py</tspan></text><text class="l14 s1" x="28" y="192" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">app/routeurs/produit.py</tspan></text><text class="l15 s1" x="28" y="219" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">alembic/versions/…_creer_table_produits.py</tspan></text><text class="l16 s1" x="28" y="246" xml:space="preserve"><tspan fill="#4ade80">  CREATE </tspan><tspan fill="#e2e8f0">tests/test_produits.py</tspan></text><text class="l17 s1" x="28" y="273" xml:space="preserve"><tspan fill="#22d3ee">  UPDATE </tspan><tspan fill="#e2e8f0">app/modeles/__init__.py</tspan></text><text class="l18 s1" x="28" y="300" xml:space="preserve"><tspan fill="#22d3ee">  UPDATE </tspan><tspan fill="#e2e8f0">app/routeurs/__init__.py</tspan></text><text class="l19 s1" x="28" y="327" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#e2e8f0">alioune migrate</tspan></text><text class="l20 s1" x="28" y="354" xml:space="preserve"><tspan fill="#94a3b8">INFO  [alembic] Running upgrade  -&gt; …, creer_table_produits</tspan></text><text class="l21 s2" x="28" y="84" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#e2e8f0">alioune serve</tspan></text><text class="l22 s2" x="28" y="111" xml:space="preserve"><tspan fill="#e2e8f0">INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)</tspan></text><text class="l23 s2" x="28" y="138" xml:space="preserve"><tspan fill="#e2e8f0">INFO:     Application startup complete.</tspan></text><text class="l24 s2" x="28" y="165" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#e2e8f0">curl http://127.0.0.1:8000/sante</tspan></text><text class="l25 s2" x="28" y="192" xml:space="preserve"><tspan fill="#facc15">{&quot;statut&quot;:&quot;ok&quot;,&quot;base_de_donnees&quot;:&quot;connectee&quot;}</tspan></text><text class="l26 s2" x="28" y="219" xml:space="preserve"><tspan fill="#4ade80">→ http://127.0.0.1:8000/docs : /api/produits et /api/categories sont prêtes</tspan></text>
