name: Publication sur PyPI

# Se déclenche quand tu publies une « Release » sur GitHub.
on:
  release:
    types: [published]

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: paquet
          path: dist/

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # « Trusted Publishing » : aucun mot de passe ni token à stocker
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquet
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
